name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  launcher:
    name: Gate unit tests and release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and release build (no audio, no device)
        working-directory: tv-app/launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease -PlauncherApplicationId=com.ts.launcher

  tools:
    name: Scripts and question bank
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax, question checks, bank regenerates identically
        run: |
          pip install -q pyyaml
          python3 -m py_compile scripts/*.py
          bash -n scripts/*.sh
          cp custom-questions/questions.example.yaml custom-questions/questions.yaml
          python3 -I scripts/add_questions.py check
          mkdir -p /tmp/proj /tmp/quiz && python3 -I scripts/build_bank_v2.py /tmp/proj /tmp/quiz
          cmp /tmp/quiz/bank.json tv-app/launcher/app/src/main/assets/quiz/bank.json
