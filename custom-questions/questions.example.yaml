# 答题看电视｜家里自己加的题目（样例；复制成 questions.yaml 再写）
#
# 写进下面的 questions 列表，再运行 scripts/add_questions.py push 推到电视。不用重新编译程序。
#
# 每道题的格式（三选一，电视遥控器选 A/B/C）：
#   - subject: 语文            # 科目，任意中文名都行；数学、英语之外的新科目要用 tvctl.py set mix=... 打开
#     kp: 拼音声调             # 知识点，答错时会换同一知识点的题；不写就等于科目名
#     question: "“妈妈”的“妈”是第几声？"
#     answer: 第一声            # 正确答案
#     wrong: [第二声, 第三声]    # 正好两个错误选项，最好是孩子常犯的错
#     explanation: "mā，一声平平的。"   # 答错时显示的讲解，一两句
#     source: 语文错题本 C001    # 可选：题目来源
#     read_aloud: "妈妈的妈是第几声？"  # 可选：电视朗读的文字，不写就读题目
#
# 改题目文字会变成新题（编号按文字生成）；删掉一题再 push，电视上就不再出这题。


questions:
  - subject: 语文
    kp: 拼音声调
    question: "“妈妈”的“妈”是第几声？"
    answer: 第一声
    wrong: [第二声, 第三声]
    explanation: "mā，一声平平的。"
